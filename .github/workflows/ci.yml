name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.compiler }} ${{ matrix.build }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build: [Release, ASAN]
        arch: [x64, arm64]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      # Runs the KMIP 2.0 integration suite too; it skips itself when unset.
      KMIP_RUN_2_0_TESTS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev ninja-build clang

      - name: Cache Cosmian KMS package
        uses: actions/cache@v6
        with:
          path: ~/cosmian-deb
          key: cosmian-kms-5.28.0-${{ runner.arch }}

      - name: Install Cosmian KMS
        run: ci/install-cosmian.sh ~/cosmian-deb

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build == 'ASAN' && 'Debug' || 'Release' }}
          -DWITH_ASAN=${{ matrix.build == 'ASAN' && 'ON' || 'OFF' }}
          -DBUILD_TESTS=ON
          -DBUILD_KMIP_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Start Cosmian KMS
        run: ci/start-cosmian.sh "${{ runner.temp }}/cosmian"

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          log=build/Testing/Temporary/LastTest.log
          if grep -F 'environment variables not configured' "$log"; then
            echo "::error::KMIP test environment not configured; integration tests skipped"
            exit 1
          fi
          # 2.0 tests are logged even when skipped: require some that passed.
          if ! grep -qF '[       OK ] KmipClientIntegrationTest20.' "$log"; then
            echo "::error::KMIP 2.0 test suite did not run"
            exit 1
          fi
          # 'listed below' filters gtest's count-summary line, which names no test
          unexpected=$(grep -F '[  SKIPPED ]' "$log" \
            | grep -v -e 'listed below' \
                      -e 'NetClientOpenSSLCanRetryAfterFailedConnect' \
                      -e 'KmipClientIntegrationTest\.LocatePageByGroupReportsLocatedItemsWhenServerProvidesIt' \
            || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected skipped tests:"
            echo "$unexpected"
            exit 1
          fi

      - name: Check install
        # ASAN builds instrument the static libraries, which a consumer built
        # without ASAN couldn't link.
        if: matrix.build == 'Release'
        run: ci/check-install.sh build Release

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-${{ matrix.compiler }}-${{ matrix.build }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/cosmian/cosmian.log
            ${{ runner.temp }}/cosmian/kms.toml
            build/Testing/
          if-no-files-found: ignore

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: pipx install clang-format==22.1.5

      - name: Check formatting
        run: ci/check-format.sh

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build docs
        run: |
          cmake -S . -B build-docs -DBUILD_DOCS=ON
          cmake --build build-docs --target doc

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install ninja openssl@3

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check unit suites ran
        run: ci/check-unit-suites.sh build/Testing/Temporary/LastTest.log

      - name: Check install
        run: ci/check-install.sh build Release -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The runner image ships OpenSSL with headers and import libraries.
      # Installing it with choco downloads the full slproweb installer
      # (over 300 MB) on every run, and that download sometimes stalls
      # for the whole job timeout, so choco is only a fallback.
      - name: Locate OpenSSL
        shell: bash
        timeout-minutes: 15
        run: |
          find_openssl() {
            for dir in "/c/Program Files/OpenSSL" "/c/Program Files/OpenSSL-Win64"; do
              if [ -e "$dir/include/openssl/ssl.h" ]; then
                echo "$dir"
                return 0
              fi
            done
            return 1
          }
          if ! dir=$(find_openssl); then
            echo "OpenSSL not found in the runner image, installing it with choco"
            choco install openssl -y --no-progress
            dir=$(find_openssl) || { echo "::error::OpenSSL install not found"; exit 1; }
          fi
          "$dir/bin/openssl.exe" version
          win=$(cygpath -w "$dir")
          echo "OPENSSL_ROOT_DIR=$win" >> "$GITHUB_ENV"
          echo "$win\\bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check unit suites ran
        shell: bash
        run: ci/check-unit-suites.sh build/Testing/Temporary/LastTest.log

      - name: Check install
        shell: bash
        run: ci/check-install.sh build Release
